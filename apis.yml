aid: standard-intelligence
name: Standard Intelligence
description: 'Standard Intelligence (si.inc) is an aligned AGI research lab based in
  San Francisco building AI models that explore and learn like humans do. Its work
  includes hertz-dev, an open-source 8.5B-parameter autoregressive base model for interactive,
  full-duplex conversational audio; a fully general computer-action model that navigates
  websites, executes CAD sequences, and drives autonomously at 30 FPS; and The Heap,
  a 30-petabyte data-storage system built in San Francisco for under $500,000. The
  company has raised $75M from Sequoia and Spark Capital. It publishes research posts
  and open-source code on GitHub but does not currently expose a public developer API.'
